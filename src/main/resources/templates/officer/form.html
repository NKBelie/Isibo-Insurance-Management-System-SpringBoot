<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${officer.id != null ? 'Edit Officer' : 'Register Officer'} + ' | ISIBO'">Register Officer | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div class="page-header">
                <h2 th:text="${officer.id != null ? 'Edit Insurance Officer' : 'Register Insurance Officer'}">Register Insurance Officer</h2>
                <div class="page-actions"><a class="btn btn-secondary" th:href="@{/officers}">Back to officers</a></div>
            </div>
            <div class="form-panel">
                <form th:action="${officer.id != null ? '/officers/' + officer.id + '/update' : '/officers'}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input id="fullName" name="fullName" type="text" th:value="${officer.fullName}" required />
                        </div>
                        <div class="form-group">
                            <label for="role">Role</label>
                            <input id="role" name="role" type="text" th:value="${officer.role}" placeholder="Claims Officer" required />
                        </div>
                        <div class="form-group">
                            <label for="contact">Contact</label>
                            <input id="contact" name="contact" type="text" th:value="${officer.contact}" required />
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Save Officer</button>
                        <a class="btn btn-secondary" th:href="@{/officers}">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
