<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${payment.id != null ? 'Edit Payment' : 'Record Payment'} + ' | ISIBO'">Record Payment | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div class="page-header">
                <h2 th:text="${payment.id != null ? 'Edit Payment' : 'Record Payment'}">Record Payment</h2>
                <div class="page-actions"><a class="btn btn-secondary" th:href="@{/payments}">Back to payments</a></div>
            </div>
            <div class="form-panel">
                <form th:action="${payment.id != null ? '/payments/' + payment.id + '/update' : '/payments'}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="paymentId">Payment ID</label>
                            <input id="paymentId" name="paymentId" type="text" th:value="${payment.paymentId}"
                                   th:readonly="${payment.id != null}" required />
                        </div>
                        <div class="form-group">
                            <label for="member">Member</label>
                            <select id="member" name="member.nationalId" required>
                                <option value="">Select member</option>
                                <option th:each="member : ${members}" th:value="${member.nationalId}"
                                        th:text="${member.memberId + ' - ' + member.firstName + ' ' + member.lastName}"
                                        th:selected="${payment.member != null and payment.member.nationalId == member.nationalId}">Member</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount (RWF)</label>
                            <input id="amount" name="amount" type="number" min="0.01" step="0.01"
                                   th:value="${payment.amount > 0 ? payment.amount : ''}" required />
                        </div>
                        <div class="form-group">
                            <label for="paymentDate">Payment Date</label>
                            <input id="paymentDate" name="paymentDate" type="date" th:value="${payment.paymentDate}" th:max="${today}" required />
                        </div>
                        <div class="form-group">
                            <label for="paymentMethod">Payment Method</label>
                            <select id="paymentMethod" name="paymentMethod" required>
                                <option value="">Select method</option>
                                <option value="Bank Transfer" th:selected="${payment.paymentMethod == 'Bank Transfer'}">Bank Transfer</option>
                                <option value="Cash" th:selected="${payment.paymentMethod == 'Cash'}">Cash</option>
                                <option value="Card" th:selected="${payment.paymentMethod == 'Card'}">Card</option>
                                <option value="Mobile Money" th:selected="${payment.paymentMethod == 'Mobile Money'}">Mobile Money</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Save Payment</button>
                        <a class="btn btn-secondary" th:href="@{/payments}">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
