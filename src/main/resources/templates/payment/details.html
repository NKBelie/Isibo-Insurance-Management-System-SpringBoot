<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Details | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div class="page-header">
                <h2 th:text="${'Payment ' + payment.paymentId}">Payment Details</h2>
                <div class="page-actions">
                    <a class="btn btn-secondary" th:href="@{/payments}">Back to payments</a>
                    <a class="btn btn-primary" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/payments/{id}/edit(id=${payment.id})}">Edit Payment</a>
                </div>
            </div>
            <section class="card form-panel">
                <div class="form-grid">
                    <div class="info-tile"><span>Payment ID</span><strong th:text="${payment.paymentId}">PAY-001</strong></div>
                    <div class="info-tile"><span>Member</span><strong th:text="${payment.member.memberId + ' - ' + payment.member.firstName + ' ' + payment.member.lastName}">Member</strong></div>
                    <div class="info-tile"><span>Amount</span><strong th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT') + ' RWF'}">10000 RWF</strong></div>
                    <div class="info-tile"><span>Payment Date</span><strong th:text="${payment.paymentDate}">2026-10-01</strong></div>
                    <div class="info-tile"><span>Method</span><strong th:text="${payment.paymentMethod}">Cash</strong></div>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
