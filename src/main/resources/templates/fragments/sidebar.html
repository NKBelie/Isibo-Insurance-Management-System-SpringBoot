<aside th:fragment="sidebar" class="sidebar" id="sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="sidebar-header">
        <div class="brand-mark">
            <span class="brand-badge">I</span>
            <div>
                <span class="brand-name">ISIBO</span>
                <small>Insurance</small>
            </div>
        </div>
        <button type="button" class="sidebar-close" aria-label="Close navigation">Close</button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/admin/dashboard}" th:classappend="${#strings.contains(requestURI, '/admin/dashboard')} ? ' active' : ''">
            <span>Dashboard</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('INSURANCE_OFFICER')" th:href="@{/officer/dashboard}" th:classappend="${#strings.contains(requestURI, '/officer/dashboard')} ? ' active' : ''">
            <span>Dashboard</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/dashboard}" th:classappend="${#strings.contains(requestURI, '/customer/dashboard')} ? ' active' : ''">
            <span>My Dashboard</span>
        </a>
        <a class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR', 'INSURANCE_OFFICER')" th:href="@{/members}" th:classappend="${#strings.contains(requestURI, '/members')} ? ' active' : ''">
            <span>Members</span>
        </a>
        <a class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR', 'INSURANCE_OFFICER')" th:href="@{/insurance-plans}" th:classappend="${#strings.contains(requestURI, '/insurance-plans')} ? ' active' : ''">
            <span>Insurance Plans</span>
        </a>
        <a class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR', 'INSURANCE_OFFICER')" th:href="@{/coverages}" th:classappend="${#strings.contains(requestURI, '/coverages')} ? ' active' : ''">
            <span>Coverage</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/providers}" th:classappend="${#strings.contains(requestURI, '/providers')} ? ' active' : ''">
            <span>Healthcare Providers</span>
        </a>
        <a class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR', 'INSURANCE_OFFICER')" th:href="@{/claims}" th:classappend="${#strings.contains(requestURI, '/claims')} ? ' active' : ''">
            <span>Claims</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/officers}" th:classappend="${#strings.contains(requestURI, '/officers')} ? ' active' : ''">
            <span>Insurance Officers</span>
        </a>
        <a class="nav-item" sec:authorize="hasAnyRole('ADMINISTRATOR', 'INSURANCE_OFFICER')" th:href="@{/payments}" th:classappend="${#strings.contains(requestURI, '/payments')} ? ' active' : ''">
            <span>Payments</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/users}" th:classappend="${#strings.contains(requestURI, '/users')} ? ' active' : ''">
            <span>Users</span>
        </a>
        <a class="nav-item" sec:authorize="hasRole('ADMINISTRATOR')" th:href="@{/reports}" th:classappend="${#strings.contains(requestURI, '/reports')} ? ' active' : ''">
            <span>Reports</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <form class="sidebar-logout" th:action="@{/logout}" method="post">
            <button class="nav-item danger" type="submit">
                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>
