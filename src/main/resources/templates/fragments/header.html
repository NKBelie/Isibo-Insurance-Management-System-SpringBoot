<header th:fragment="header" class="topbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="topbar-left">
        <div>
            <p class="eyebrow">ISIBO</p>
            <h1 th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</h1>
        </div>
    </div>

    <div class="topbar-actions">
        <div class="user-chip">
            <span class="user-avatar" aria-hidden="true">IS</span>
            <span class="user-details">
                <strong sec:authentication="name">Account</strong>
                <small sec:authorize="hasRole('ADMINISTRATOR')">Administrator</small>
                <small sec:authorize="hasRole('INSURANCE_OFFICER')">Insurance Officer</small>
                <small sec:authorize="hasRole('CUSTOMER')">Customer</small>
            </span>
        </div>
    </div>
</header>
