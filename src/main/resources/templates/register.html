<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Create an account</h1>
    <p class="subtle">Register for Insurance Officer access</p>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" th:field="*{username}" minlength="3" maxlength="60" autocomplete="username" required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="passwordHash" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="form-group">
            <label for="passwordConfirmation">Confirm password</label>
            <input id="passwordConfirmation" type="password" name="passwordConfirmation" minlength="8" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary full-width">Create account</button>
    </form>
    <p class="subtle"><a th:href="@{/login}">Return to sign in</a></p>
</main>
</body>
</html>
