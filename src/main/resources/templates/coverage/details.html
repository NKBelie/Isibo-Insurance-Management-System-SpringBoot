<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coverage Details | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <h2>Coverage Details</h2>
                <div class="page-actions">
                    <a class="btn btn-secondary" th:href="@{/coverages}">Back to coverages</a>
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-header">
                    <div>
                        <h3 th:text="${coverage.coverageId}">Coverage ID</h3>
                    </div>
                    <div class="action-group">
                        <a class="action-link" th:href="@{/coverages/{id}/edit(id=${coverage.id})}">Edit</a>
                        <form th:action="@{/coverages/{id}/delete(id=${coverage.id})}" method="post" style="display:inline;">
                            <button class="action-link danger" type="submit" data-confirm-delete="Delete Coverage?">Delete</button>
                        </form>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="field-group">
                        <label>Coverage ID</label>
                        <span th:text="${coverage.coverageId}">COV-001</span>
                    </div>
                    <div class="field-group">
                        <label>Insurance Plan</label>
                        <span th:text="${coverage.insurancePlan != null ? coverage.insurancePlan.insurancePlanName : 'Not assigned'}">Plan A</span>
                    </div>
                    <div class="field-group full-span">
                        <label>Description</label>
                        <span th:text="${coverage.description}">Coverage description</span>
                    </div>
                    <div class="field-group">
                        <label>Coverage Amount</label>
                        <span th:text="${#numbers.formatDecimal(coverage.coverageAmount, 0, 'COMMA', 0, 'POINT') + ' RWF'}">500000 RWF</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
