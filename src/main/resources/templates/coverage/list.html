<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coverages | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <h2>Coverages</h2>
                <div class="page-actions">
                    <a class="btn btn-primary" th:href="@{/coverages/new}">Add Coverage</a>
                </div>
            </div>

            <div class="table-shell">
                <div class="table-toolbar">
                    <div class="filter-row">
                        <input type="text" placeholder="Search coverage" />
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Coverage ID</th>
                            <th>Plan</th>
                            <th>Description</th>
                            <th>Coverage Amount</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="coverage : ${coverages}">
                            <td th:text="${coverage.coverageId}">COV-001</td>
                            <td th:text="${coverage.insurancePlan != null ? coverage.insurancePlan.insurancePlanName : '—'}">Plan A</td>
                            <td th:text="${coverage.description}">Description</td>
                            <td th:text="${#numbers.formatDecimal(coverage.coverageAmount, 0, 'COMMA', 0, 'POINT') + ' RWF'}">500000 RWF</td>
                            <td>
                                <div class="action-group">
                                    <a class="action-link primary" th:href="@{/coverages/{id}(id=${coverage.id})}">View</a>
                                    <a class="action-link" th:href="@{/coverages/{id}/edit(id=${coverage.id})}">Edit</a>
                                    <form th:action="@{/coverages/{id}/delete(id=${coverage.id})}" method="post" style="display:inline;">
                                        <button class="action-link danger" type="submit" data-confirm-delete="Delete Coverage?">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(coverages)}">
                            <td colspan="5">
                                <div class="empty-state">
                                    <h4>No coverage records found.</h4>
                                    <p>Create a new coverage record for an insurance plan.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
