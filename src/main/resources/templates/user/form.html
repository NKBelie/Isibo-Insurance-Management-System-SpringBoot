<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${user.id != null ? 'Edit User' : 'Create User'} + ' | ISIBO'">Create User | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div class="page-header">
                <h2 th:text="${user.id != null ? 'Edit System User' : 'Create System User'}">Create System User</h2>
                <div class="page-actions"><a class="btn btn-secondary" th:href="@{/users}">Back to users</a></div>
            </div>
            <div class="form-panel">
                <form th:action="${user.id != null ? '/users/' + user.id + '/update' : '/users'}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input id="username" name="username" type="text" th:value="${user.username}" minlength="3" maxlength="60" required />
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" th:value="${user.email}" required />
                        </div>
                        <div class="form-group">
                            <label for="role">Role</label>
                            <select id="role" name="role" required>
                                <option th:each="option : ${userRoles}" th:value="${option.value}" th:text="${option.label}"
                                        th:selected="${currentRole == option.value or user.role == option.value}">Customer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="passwordHash" th:text="${user.id != null ? 'New Password (optional)' : 'Password'}">Password</label>
                            <input id="passwordHash" name="passwordHash" type="password" minlength="8"
                                   th:required="${user.id == null}" autocomplete="new-password" />
                        </div>
                        <div class="form-group">
                            <label for="passwordConfirmation">Confirm Password</label>
                            <input id="passwordConfirmation" name="passwordConfirmation" type="password" minlength="8"
                                   th:required="${user.id == null}" autocomplete="new-password" />
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Save User</button>
                        <a class="btn btn-secondary" th:href="@{/users}">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
