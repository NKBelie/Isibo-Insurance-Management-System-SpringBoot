<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members | ISIBO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/tables.css}" />
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-panel">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="page-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="page-header">
                <h2>Members</h2>
                <div class="page-actions">
                    <a class="btn btn-primary" th:href="@{/members/new}">Register Member</a>
                </div>
            </div>

            <div class="table-shell">
                <div class="table-toolbar">
                    <div class="filter-row">
                        <input id="member-search" type="text" placeholder="Search member" th:value="${search}" />
                        <select id="member-status-filter" aria-label="Filter by status">
                            <option value="">All Status</option>
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == selectedStatus}"></option>
                        </select>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Member ID</th>
                            <th>National ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Insurance Plan</th>
                            <th>Status</th>
                            <th>Registration Date</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${members}" th:data-member-row="${member.nationalId}" th:data-status="${member.status}">
                            <td th:text="${member.memberId}">MEM-001</td>
                            <td th:text="${member.nationalId}">1199887766554433</td>
                            <td th:text="${member.firstName + ' ' + member.lastName}">Belie Ndayisaba</td>
                            <td th:text="${member.email}">belie@example.com</td>
                            <td th:text="${member.phone}">0788000000</td>
                            <td th:text="${member.insurancePlan != null ? member.insurancePlan.insurancePlanName : '—'}">Plan A</td>
                            <td>
                                <span class="status-badge" th:classappend="${#strings.equalsIgnoreCase(member.status, 'ACTIVE')} ? ' status-active' : (${#strings.equalsIgnoreCase(member.status, 'INACTIVE')} ? ' status-inactive' : ' status-expired')"
                                      th:text="${member.status}">ACTIVE</span>
                            </td>
                            <td th:text="${#temporals.format(member.registrationDate, 'yyyy-MM-dd')}">2026-01-01</td>
                            <td>
                                <div class="action-group">
                                    <a class="action-link primary" th:href="@{/members/{id}(id=${member.nationalId})}">View</a>
                                    <a class="action-link" th:href="@{/members/{id}/edit(id=${member.nationalId})}">Edit</a>
                                    <form th:action="@{/members/{id}/delete(id=${member.nationalId})}" method="post" style="display:inline;">
                                        <button class="action-link danger" type="submit" data-confirm-delete="Delete Member? This action cannot be undone.">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(members)}">
                            <td colspan="9">
                                <div class="empty-state">
                                    <h4>No members found.</h4>
                                    <p>Register your first member to get started.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/member.js}"></script>
</body>
</html>
