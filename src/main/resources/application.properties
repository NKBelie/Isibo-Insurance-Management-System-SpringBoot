spring.application.name=IsiboInsuranceSpringBoot

# PostgreSQL settings; configure DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isibo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Bootstrap an administrator only when all APP_BOOTSTRAP_ADMIN_* variables are set.
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
